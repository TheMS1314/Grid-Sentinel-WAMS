name: Grid Sentinel regression gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/grid-sentinel-codespaces
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-platform:
    name: FastAPI and private deployment safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smartgrid_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            smartgrid_platform/backend/requirements.txt
            smartgrid_platform/backend/requirements-test.txt
            smartgrid_platform/requirements-preflight.txt
      - name: Install clean Python test dependencies
        run: python -m pip install -r backend/requirements-test.txt -r requirements-preflight.txt
      - name: Verify backend API and Alembic migrations
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Verify backup, private preflight, acceptance and recovery unit tests
        run: python -m unittest -q tests.test_operations tests.test_deployment_preflight tests.test_deployment_acceptance tests.test_restore_drill tests.test_codespaces_deploy tests.test_persistence_acceptance

  react-production:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smartgrid_platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: smartgrid_platform/frontend/package-lock.json
      - name: Install exactly locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build production UI
        run: npm run build
